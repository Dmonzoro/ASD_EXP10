
name: Customer Segmentation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app.py

      - name: Verify model files
        run: |
          python -c "import os; files=['kmeans_model.pkl','pca_model.pkl','scaler.pkl']; missing=[f for f in files if not os.path.isfile(f)]; print('All model files found' if not missing else 'Missing: '+', '.join(missing)); exit(bool(missing))"

      - name: Build Docker image
        run: docker build -t customer-segmentation:ci .
